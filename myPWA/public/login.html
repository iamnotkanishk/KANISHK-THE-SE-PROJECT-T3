<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StagePass</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-row">
                <img src="images/image.png" alt="StagePass logo" class="logo-image" />
                <h1 id="pageTitle">StagePass</h1>
            </div>
        </div>
    </header>

    <main style="max-width:520px; margin:40px auto; padding:0 20px;">
        <div class="admin-card" style="padding:28px;">
            <h2 style="margin-top:0;">Login to Your Account</h2>
            <div id="errorMessage" class="error" style="display:none;"></div>
            <div id="successMessage" class="success" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label> 
                    <input type="text" id="username" name="username" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />
                </div>
                <button type="submit" class="find-tickets-btn" style="width:100%;">Login</button>
            </form>

            <div style="display:flex; align-items:center; gap:12px; justify-content:center; margin-top:16px;">
                <span style="color:#64748b; font-weight:600;">or</span>
            </div>

            <div style="text-align:center; margin-top:12px;">
                <a href="signup.html" class="find-tickets-btn" style="display:inline-block;">Sign up</a>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
